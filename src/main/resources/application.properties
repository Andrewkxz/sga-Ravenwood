spring.application.name=sga

# --- Base de datos H2 en memoria ---
spring.datasource.url=jdbc:h2:mem:sgadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Consola web de H2 ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Servidor ---
server.port=8080

# --- Parámetros del Alojamiento ---
sga.alojamiento.umbral-edad-facturable=18
sga.alojamiento.hora-entrada=15:00
sga.alojamiento.hora-salida=11:00
sga.alojamiento.tiempo-preparacion-horas=4
sga.alojamiento.hora-limite-no-show=22:00
